# # # # # # # # # # # # # # # # # # # # # # # #
# ----------------------------------------------------------------------
# Window / Session Options
# ----------------------------------------------------------------------
#set-option -g mouse-select-pane on
set-option -g base-index 0
# CopyMode vi
set-window-option -g mode-keys vi

# ----------------------------------------------------------------------
# Keybind
# ----------------------------------------------------------------------
# Prefix to C-t
#set-option -g prefix C-t
set-option -g prefix C-Space
unbind-key C-b
bind C-Space send-prefix

# ----------------------------------------------------------------------
# Window / Pane
# ----------------------------------------------------------------------
# Open current pane to new window
bind ! break-pane -d
# Hirozontally / Vertically split pane
unbind -
unbind |
bind - split-window -v
bind | split-window -h

# ペイン移動 (vim 風: h=左 / j=下 / k=上 / l=右)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインリサイズ (大文字 H/J/K/L、連続押し可)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ----------------------------------------------------------------------
# screen compatibile settings
# ----------------------------------------------------------------------
# go to prev window
unbind C-Space
bind C-Space last-window
# copy mode
bind Escape copy-mode
# rename window
bind A command-prompt "rename-window '%%'"
# list(choose) window
unbind '"'
bind '"' choose-window

# ----------------------------------------------------------------------
# Color
# ----------------------------------------------------------------------
# 256色表示する
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'
set -g default-terminal "xterm"

# ----------------------------------------------------------------------
# etc
# ----------------------------------------------------------------------
# tmuxとmacのクリップボードを共有する
# reattach-to-user-namespace をインストールしないと、tmuxが動作しなくなる
# brew install などでインストールしてから使うこと
set-option -g default-command "reattach-to-user-namespace -l zsh"

# エスケープキーを押した際の反応速度を早くする
set -g escape-time 0
